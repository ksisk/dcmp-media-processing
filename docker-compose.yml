# DCMP Media portal: Caddy serves the shell (site/) and proxies the two apps.
#   cp .env.example .env   # upstream addresses
#   docker compose up -d
services:
  portal:
    image: caddy:2
    container_name: dcmp-portal
    restart: unless-stopped
    ports:
      - "${PORTAL_PORT:-80}:80"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
